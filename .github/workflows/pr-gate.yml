name: PR Gate

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

jobs:
  validate:
    name: Validate PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail direct pushes to main repo
        run: |
          if [ "${{ github.event.pull_request.head.repo.full_name }}" == "${{ github.repository }}" ]; then
            echo "::error::Direct pushes to the main repository are not allowed. Please open this PR from a fork."
            exit 1
          fi

      - name: Require linked issue
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || '';
            const issuePattern = /#\d+|\b(?:fixes|closes|resolves)\s*#\d+/i;
            const linked = body.match(/#\d+/g) || [];
            const closes = body.match(/\b(?:fixes|closes|resolves)\s*#\d+/i);
            const hasIssue = linked.length > 0 || !!closes;
            const noTask = /\[x\]\s*No issue linked/i.test(body);
            if (!hasIssue && !noTask) {
              core.setFailed('This PR must reference a linked issue (e.g. "Fixes #123") or explicitly check "No issue linked".');
            }
