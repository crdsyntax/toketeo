<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" fill="none">
  <defs>
    <linearGradient id="primary-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="glow-grad" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="512" cy="512" r="480" fill="url(#primary-grad)" opacity="0.06"/>
  <circle cx="512" cy="512" r="460" fill="url(#primary-grad)" opacity="0.04"/>

  <!-- Database cylinder body -->
  <g transform="translate(512,482)">
    <!-- Cylinder top ellipse -->
    <ellipse cx="0" cy="-160" rx="200" ry="60" fill="url(#primary-grad)"/>
    <!-- Cylinder body -->
    <path d="M-200 -160 L-200 120 C-200 153 -110 180 0 180 C110 180 200 153 200 120 L200 -160" fill="url(#accent-grad)" opacity="0.9"/>
    <!-- Cylinder top face (inner) -->
    <ellipse cx="0" cy="-160" rx="200" ry="60" fill="url(#primary-grad)"/>
    <!-- Cylinder highlight -->
    <ellipse cx="-60" cy="-165" rx="80" ry="25" fill="url(#glow-grad)"/>
  </g>

  <!-- Play/execution triangle inside the cylinder -->
  <g transform="translate(512,482)">
    <polygon points="-45,-185 45,-155 -45,-125" fill="#ffffff" opacity="0.9"/>
    <polygon points="-35,-178 35,-155 -35,-132" fill="#0a0a0a"/>
  </g>

  <!-- Data nodes flowing -->
  <g filter="url(#glow)">
    <circle cx="280" cy="350" r="12" fill="#06b6d4" opacity="0.7"/>
    <circle cx="320" cy="300" r="8" fill="#8b5cf6" opacity="0.5"/>
    <circle cx="744" cy="350" r="12" fill="#06b6d4" opacity="0.7"/>
    <circle cx="704" cy="300" r="8" fill="#8b5cf6" opacity="0.5"/>
  </g>

  <!-- Connection lines (data flow) -->
  <g stroke="#8b5cf6" stroke-width="2" opacity="0.3" fill="none">
    <path d="M292 350 Q400 280 512 322"/>
    <path d="M732 350 Q624 280 512 322"/>
    <path d="M328 300 Q420 260 512 322"/>
    <path d="M696 300 Q604 260 512 322"/>
  </g>

  <!-- Bottom decorative ring -->
  <ellipse cx="512" cy="770" rx="300" ry="25" fill="url(#primary-grad)" opacity="0.08"/>
</svg>
